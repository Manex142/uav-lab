name: CI/CD Pipeline & Hetzner Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: timescale/timescaledb:latest-pg16
        credentials:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        env:
          POSTGRES_DB: uav_telemetry
          POSTGRES_USER: uav_admin
          POSTGRES_PASSWORD: uav_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uav_admin -d uav_telemetry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run Go Tests
        run: go test -v ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Frontend Check
        run: |
          cd web
          npm ci
          npm run build

  build-and-push:
    name: Build & Push Docker Image (GHCR)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Hetzner VPS
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            echo "🚀 [Deploy] Starting deployment on Hetzner VPS..."

            # 1. Ensure deployment target exists
            if [ ! -d "/opt/uav-lab" ]; then
              echo "📦 [Deploy] Initial clone of repository..."
              git clone https://github.com/${{ github.repository }}.git /opt/uav-lab
            fi

            cd /opt/uav-lab

            # 2. Update repository definitions
            git fetch origin main
            git reset --hard origin/main

            # 3. Ensure production environment secrets file exists (auto-bootstrap on first run)
            if [ ! -f "/opt/uav-lab/.env" ]; then
              echo "⚠️ [Deploy] Initializing /opt/uav-lab/.env from template..."
              cp /opt/uav-lab/.env.example /opt/uav-lab/.env
              sed -i 's/uav.example.com/uav.manex.dev/' /opt/uav-lab/.env
              RAND_PASS=$(openssl rand -hex 16)
              sed -i "s/change_this_to_a_secure_password_in_production/$RAND_PASS/" /opt/uav-lab/.env
              echo "🔒 [Deploy] Generated unique secure database password in /opt/uav-lab/.env"
            fi

            # 4. Pull newly published pre-built image from GHCR
            echo "📥 [Deploy] Pulling latest pre-built container from GHCR..."
            docker compose -f docker-compose.prod.yml pull gateway

            # 5. Spin up the application stack
            echo "⚡ [Deploy] Applying updated stack..."
            docker compose -f docker-compose.prod.yml up -d

            # 6. Clean up dangling older images to preserve disk space
            docker image prune -f

            echo "✅ [Deploy] Deployment finished successfully!"
